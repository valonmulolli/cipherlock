name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.11

      - name: Test
        run: go test -race -count=1 -timeout=600s ./...

      - name: Benchmark
        run: go test -bench=. -benchmem -count=1 -run='^$$' -timeout=600s ./cipherlock/...

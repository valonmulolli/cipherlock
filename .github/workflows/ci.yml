name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'  # weekly: Monday 06:00 UTC

jobs:
  ci:
    strategy:
      matrix:
        go: ["1.24.x", "1.25.x"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 -timeout=600s ./...

      - name: Compression tests
        run: go test -race -count=1 -timeout=300s -run 'Compression' ./...

      - name: Fuzz tests (5 min per target)
        if: github.event_name == 'schedule'
        run: |
          for target in FuzzDecryptStream FuzzDecryptStreamV2 FuzzDecryptStreamMulti FuzzDecryptAsymmetric FuzzDeserializeIdentity FuzzUnarmorBytes; do
            echo "=== $target ==="
            go test -fuzz="^$target$" -fuzztime=5m ./cipherlock/
          done

      - name: Benchmark
        run: go test -bench=. -benchmem -count=1 -run='^$$' -timeout=600s ./cipherlock/...
